name: deploy-miniprogram

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview=只出预览二维码 / upload=只上传版本 / both=二维码+上传（同一次构建，版本号一致）'
        default: 'both'
        type: choice
        options: [preview, upload, both]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install miniprogram-ci
        run: npm install miniprogram-ci --no-fund --no-audit --registry=https://registry.npmmirror.com
      - name: Write upload key
        run: printf '%s' "${{ secrets.MP_PRIVATE_KEY }}" > private.key
      - name: Stamp build version
        # 把本次构建号写进 utils/version.js：应用内显示的版本 = 后台上传的版本号，
        # 两边不可能再分叉（以前手机 v1.1.2 / 后台 1.0.57）
        env:
          MP_BUILD: ${{ github.run_number }}
          MP_SHA: ${{ github.sha }}
        run: node scripts/stamp-version.js
      - name: Deploy
        env:
          MP_APPID: ${{ secrets.MP_APPID }}
          MP_KEY_PATH: ${{ github.workspace }}/private.key
          # 版本号带构建号 + 备注带 commit 短号：后台「版本管理」里能一眼认出哪次是哪次
          MP_BUILD: ${{ github.run_number }}
          MP_SHA: ${{ github.sha }}
        run: node scripts/upload.js "${{ inputs.mode }}"
      - name: Upload QR artifact
        if: inputs.mode == 'preview' || inputs.mode == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: preview-qr
          path: preview-qr.png
