name: deploy-miniprogram

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview=生成预览二维码 / upload=上传版本(设体验版用)'
        default: 'preview'
        type: choice
        options: [preview, upload]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install miniprogram-ci
        run: npm install miniprogram-ci --no-fund --no-audit --registry=https://registry.npmmirror.com
      - name: Write upload key
        run: printf '%s' "${{ secrets.MP_PRIVATE_KEY }}" > private.key
      - name: Deploy
        env:
          MP_APPID: ${{ secrets.MP_APPID }}
          MP_KEY_PATH: ${{ github.workspace }}/private.key
        run: node scripts/upload.js "${{ inputs.mode }}"
      - name: Upload QR artifact
        if: inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: preview-qr
          path: preview-qr.png
